name: dorar
description: Dorar — تطبيق Flutter أصلي للأذكار والختمة والتسبيح والصيام والتذكيرات مع مزامنة Supabase.
publish_to: 'none'
version: 3.6.0+40

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  path_drawing: ^1.0.1
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.17
  path_provider: ^2.1.4
  http: ^1.2.2
  hijri: ^3.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  pdfrx: ^2.0.0 # قارئ PDF داخلي (PDFium، MIT) — يلزم التحقق بـ flutter pub get

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/brand/
    - assets/mushaf/
    - assets/hadith/
    - assets/hadith/bukhari/
    - assets/hadith/muslim/
  fonts:
    # خط الواجهة: Ping AR + LT (خفيف الوزن مُحوَّل كله إلى Bold حسب الطلب)
    - family: PingAR
      fonts:
        - asset: assets/fonts/ping-ar-lt-bold.otf
        - asset: assets/fonts/ping-ar-lt-bold.otf
          weight: 500
        - asset: assets/fonts/ping-ar-lt-bold.otf
          weight: 600
        - asset: assets/fonts/ping-ar-lt-bold.otf
          weight: 700
        - asset: assets/fonts/ping-ar-lt-heavy.otf
          weight: 800
        - asset: assets/fonts/ping-ar-lt-heavy.otf
          weight: 900
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
